name: Task 1 verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dataset pipeline
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install -e .

      - name: Install RAG demo dependencies
        run: python -m pip install -r rag_demo/requirements.txt

      - name: Lint
        run: python -m ruff check .

      - name: Dataset tests
        run: python -m pytest tests/ -v --cov=. --cov-report=term-missing --cov-fail-under=80

      - name: Dataset workbook audit
        run: python scripts/audit_xlsx.py

      - name: RAG tests
        working-directory: rag_demo
        run: python -m pytest tests/ -v --cov=. --cov-report=term-missing --cov-fail-under=80

      - name: RAG eval smoke
        working-directory: rag_demo
        run: python -m src.eval.run_eval --out reports/eval_report_ci.md

      - name: Dependency audit
        run: |
          python -m pip_audit -r requirements.lock
          python -m pip_audit -r rag_demo/requirements.txt

      - name: Secret scan
        run: python scripts/secret_scan.py
