[project]
name = "fo-dataset-pipeline"
version = "0.1.0"
description = "Validated family office dataset pipeline for the PolarityIQ assessment."
requires-python = ">=3.11"
dependencies = [
  "dnspython>=2.6",
  "email-validator>=2.2",
  "httpx>=0.27",
  "openpyxl>=3.1",
  "pandas>=2.2",
  "pydantic>=2.7",
  "pypdf>=5.0",
  "typer>=0.12",
]

[project.scripts]
fo-dataset = "fo_dataset_pipeline.cli:app"
fo-apify = "fo_dataset_pipeline.apify_research:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
  ".pytest_cache",
  ".ruff_cache",
  "data",
  "rag_demo/data",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"rag_demo/scripts/*.py" = ["E402"]
"rag_demo/src/ui/app.py" = ["E402"]
